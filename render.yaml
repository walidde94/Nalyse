version: "1"
services:
  - type: web
    name: nalyse-backend
    env: node
    rootDir: backend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: nalyse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: "production"
      - key: FRONTEND_URL
        value: "https://nalyse.vercel.app" # You will need to update this after Vercel deployment completes
# Automatically provision a PostgreSQL database
databases:
  - name: nalyse-db
    databaseName: nalyse_prod
    user: nalyse_user
    plan: free # or standard if you need more resources
