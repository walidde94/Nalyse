version: '3.8'

services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nalyse_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_NAME=nalyse_dev
      - PORT=3000
      - JWT_SECRET=your-secure-secret-key-change-it
      - JWT_REFRESH_SECRET=your-secure-refresh-key-change-it
      # Change this to your computer's IP address if you want to access from a phone
      - FRONTEND_URL=http://192.168.2.102:5173
    volumes:
      - ./backend/uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://192.168.2.102:3001
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
