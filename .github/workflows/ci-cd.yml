name: 🚀 Enterprise Pipeline

on:
  push:
    branches: [ "main", "master", "sprint-*" ]
  pull_request:
    branches: [ "main", "master" ]

# Automatically cancel in-progress runs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: ⚙️ Backend Services
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: 📦 Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: 🔒 Security Audit
      run: npm audit --audit-level=high || true
      # '|| true' ensures the pipeline doesn't crash on audit warnings, just logs them

    - name: 🛠️ Typecheck & Build
      run: npm run build --if-present

  validate-frontend:
    name: 🎨 Frontend Application
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 📦 Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: 🔒 Security Audit
      run: npm audit --audit-level=high || true

    - name: 🛠️ Typecheck & Build
      run: npm run build --if-present
