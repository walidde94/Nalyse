<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Open Graph -->
    <title>Nalyse — Intelligent Data Analytics Platform</title>
    <meta name="description" content="Nalyse connects your data sources to deliver AI-powered analytics, predictive insights, and enterprise business intelligence. Transform raw data into strategic decisions." />
    <meta name="keywords" content="data analytics, business intelligence, AI insights, predictive analytics, data science, enterprise analytics" />
    <meta property="og:title" content="Nalyse — Intelligent Data Analytics Platform" />
    <meta property="og:description" content="Transform raw data into strategic decisions with AI-powered analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#020617" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically reload the page if a dynamically imported chunk fails to load.
      // This typically happens when a new version is deployed and the browser still
      // holds the old index.html pointing to outdated JavaScript chunks.
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('Vite preload error detected, reloading page to fetch latest version...');
        window.location.reload();
      });
    </script>
  </body>
</html>
