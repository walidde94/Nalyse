openapi: 3.0.0
info:
  title: Nalyse Platform API
  version: 3.0.0
  description: Official OpenAPI 3.0 Specification for Nalyse, detailing endpoints for Authentication, Intelligence Analysis, File Ingestion, and the Anomaly Detection Engine.

servers:
  - url: http://localhost:3000
    description: Local Development Environment
  - url: https://api.nalyse.com
    description: Production Environment

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

paths:
  /api/auth/login:
    post:
      summary: Authenticate User
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful. Returns JWT accessToken.
        '401':
          description: Unauthorized

  /api/files/upload:
    post:
      summary: Upload Dataset for Analysis
      tags: [Ingestion]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File precisely uploaded and hashed.
        '409':
          description: Duplicate file detected logically.

  /api/reports:
    get:
      summary: Retrieve Saved Insights & Reports
      tags: [Intelligence]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of stored intelligence narratives generated by Nexus AI.

  /api/platform/analytics:
    get:
      summary: Fetch System Health & Engine Performance
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Returns system-wide operational metrics, processing latency percentiles, and live internet bandwidth usage.

tags:
  - name: Authentication
    description: Standard JWT flows
  - name: Ingestion
    description: Handlers for receiving structured data dumps
  - name: Intelligence
    description: Nexus AI endpoints and derived insights
  - name: Admin
    description: Overarching platform operational visibility
